# Site public (GitHub Pages) : collecte quotidienne des annonces -> JSON -> site statique React.
# Le serveur (FastAPI) n'existe pas ici : filtres et score sont calculés dans le navigateur (frontend/src/lib/staticApi.ts).
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # tous les jours, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      db:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: ilo, POSTGRES_PASSWORD: ci, POSTGRES_DB: ilo}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ilo -d ilo" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ilo
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ilo
      AUTH_ENABLED: "false"
      CONFIG_PATH: ${{ github.workspace }}/config/app.yaml
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}

      - name: Dépendances et tests
        run: |
          pip install "./backend[dev]"
          (cd backend && pytest -q)
          (cd frontend && npm ci --no-audit --no-fund && npm test --silent)

      - name: Base de données
        run: cd backend && python -m alembic upgrade head

      - name: Version précédente du site (conserve la date de première apparition)
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/listings.json" -o previous.json || echo "pas de version précédente"

      - name: Collecte (annonces, puis enrichissements, puis données de référence)
        continue-on-error: true
        timeout-minutes: 30
        run: python -m app.cli ingest

      - name: Recalcul des indicateurs
        if: always()
        run: python -m app.cli recompute

      - name: Export JSON
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p site-data
          python -m app.cli export-static site-data/listings.json previous.json
          python - <<'PY'
          import json, os
          new = len(json.load(open("site-data/listings.json"))["items"])
          old = len(json.load(open("previous.json"))["items"]) if os.path.exists("previous.json") else 0
          print(f"annonces : {new} (avant : {old})")
          # garde-fou : si une source est bloquée depuis GitHub, on ne remplace pas un bon site par un site vide
          assert new >= 10 and new >= 0.5 * old, "export trop petit : déploiement annulé"
          PY

      - name: Build du site statique
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          mkdir -p dist/data
          cp ../site-data/listings.json dist/data/listings.json
          cp ../site-data/feed.xml dist/feed.xml
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
