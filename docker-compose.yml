name: ilo
x-backend: &backend
  build: ./backend
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ilo}:${POSTGRES_PASSWORD:-change-me-db}@db:5432/${POSTGRES_DB:-ilo}
    CONFIG_PATH: /app/config/app.yaml
    DATA_DIR: /data
  volumes:
    - ./config:/app/config:ro
    - ./data:/data
  depends_on:
    db: {condition: service_healthy}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
      POSTGRES_DB: ${POSTGRES_DB:-ilo}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilo} -d ${POSTGRES_DB:-ilo}"]
      interval: 5s
      retries: 20

  backend:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8000}:8000"]

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      backend: {condition: service_started}
      db: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [backend]

volumes:
  pgdata:
