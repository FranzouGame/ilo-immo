[project]
name = "ilo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0.30", "psycopg[binary]>=3.2",
  "alembic>=1.13", "geoalchemy2>=0.15", "shapely>=2.0", "pyproj>=3.6", "httpx>=0.27", "pydantic>=2.7",
  "pydantic-settings>=2.3", "pyyaml>=6", "apscheduler>=3.10,<4", "pyjwt>=2.8", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-pyyaml"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 140
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
